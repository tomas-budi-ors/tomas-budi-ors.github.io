featured:
- {name: '"Macroeconomic Development, Rural Exodus, and Uneven Industrialization"',
   extra_info: 'November 2026 (first version March 2022), <a href="https://cepr.org/publications/dp17086" target="_blank" rel="noopener noreferrer">CEPR DP17086</a>',
   coauthors: 'with <a href="https://www.cemfi.es/~pijoan/" target="_blank" rel="noopener noreferrer">Josep Pijoan-Mas</a>',
   url: '/working_papers/SC_Migration_18.pdf',
   status: '<b>New version!</b> Revised and Resubmitted to the <b><em>JPE Macro</em></b>', 
   abstract: 'We show how internal migrations are a key determinant of the heterogeneous industrialization paths experienced by leading and laggard regions within a country. Focusing on Spain (1940-2000), we find that internal migrations, driven by declining migration costs, fully explain the lack of industrialization of its laggard areas, and accelerated growth at the aggregate level.'}
- {name: '"Rural-Urban Migration and Structural Change: A Reinterpretation"',
    extra_info: '<span style="font-size: 17px;"> (JMP) </span> March 2026 (first version October 2023)',
    url: '/working_papers/BudiOrs_JMP.pdf', 
    # links: '<a href="/working_papers/BudiOrs_JMP.pdf" target="_blank" rel="noopener noreferrer"">Working paper</a>',
    status: 'Revise and Resubmit <b><em>JPE Macro</em></b>',
    abstract: 'Using panel data from Indonesia, I show that most workers switch from agriculture to non-agriculture within rural areas, rather than through migration to urban areas. Armed with a model in which workers choose both their location and their sector of work, I find that frictions to leave agriculture, rather than migration costs, are the main barrier to structural transformation.'}
- {name: '"The Life-Cycle of Firms and the Productivity Advantages of Large Cities"', 
   abstract: 'Using Spanish administrative data, I show that firms are more productive and grow more over their life-cycle in larger cities, while they exit at similar rates across cities. I leverage this information to discipline a model where heterogeneous firms make location choices at birth and then receive idiosyncratic productivity shocks over their life-cycle. Using the model, I quantify the contribution of firm sorting to the urban productivity premium and evaluate the effects of place-based and size-dependent policies.'}
